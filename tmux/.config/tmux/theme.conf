# Tokyo Night Theme for Tmux
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #h #[bg=#bb9af7,fg=#1a1b26,bold] #S #[default] "
set -g status-right "#[bg=#16161e,fg=#c0caf5] %Y-%m-%d %H:%M #[default]"
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W #[default]"
