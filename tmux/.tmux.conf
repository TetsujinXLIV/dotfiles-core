# ----------------------------------------------------
# 1. BASE SETTINGS
# ----------------------------------------------------

# Enable 24-bit color (True Color) support
# 'set -g default-terminal "screen-256color"' is often a source of color issues.
# A more modern and robust setting is often:
set -g default-terminal "tmux-256color"
# Override terminal capabilities to ensure True Color works everywhere
# The 'ag' flag appends to terminal-overrides for better compatibility
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm*:Tc"
# Force bash
set-option -g default-shell /bin/bash

# ----------------------------------------------------
# 2. KEYBINDINGS & NAVIGATION
# ----------------------------------------------------

# Change prefix from C-b (Ctrl+b) to C-s (Ctrl+s)
set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

# Easier config reloading.
# Press <Prefix> + r to reload the configuration file.
unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded."

# Split Window Keybindings (More intuitive bindings)
# Split horizontally (left/right) with <Prefix> + |
unbind %
bind | split-window -h -c '#{pane_current_path}'

# Split vertically (top/bottom) with <Prefix> + -
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Resize Panes using H/J/K/L (Press <Prefix>, then hold H/J/K/L)
# The '-r' makes the binding repeatable (hold down the key for continuous resize)
bind -r j resize-pane -D 5 # Down
bind -r k resize-pane -U 5 # Up
bind -r l resize-pane -R 5 # Right
bind -r h resize-pane -L 5 # Left

# Toggle pane zoom (maximize/restore) with <Prefix> + m
bind -r m resize-pane -Z

# Enable Mouse Support (Scrolling, resizing, selecting windows/panes)
set -g mouse on


# ----------------------------------------------------
# 3. COPY MODE (Vim-style)
# ----------------------------------------------------

# Use Vim keybindings inside copy mode
set-window-option -g mode-keys vi
set -s set-clipboard on

# start selecting text with 'v'
bind-key -T copy-mode-vi 'v' send -X begin-selection

# copy text with 'y' directly to system clipboard (Wayland wl-copy / X11 xclip)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || true"

# Mouse drag copies to system clipboard without abrupt clearing
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || true"


# ----------------------------------------------------
# 4. PLUGIN MANAGER (TPM)
# ----------------------------------------------------

# Plugin Manager Path (keep at the top of the plugin section)
set -g @plugin 'tmux-plugins/tpm'

# List of Tmux plugins to install (C-s + I)
set -g @plugin 'christoomey/vim-tmux-navigator' # For seamless navigation between tmux panes and Vim/Neovim

# IMPORTANT: Ensure 'catppuccin/tmux' is NOT in this list, as you are
# managing it manually via 'run' command below.


# ----------------------------------------------------
# 5. THEME CONFIGURATION
# ----------------------------------------------------
source-file -q ~/.config/tmux/theme.conf

# ----------------------------------------------------
# 7. INITIALIZE TPM
# ----------------------------------------------------

# Initialize TMUX plugin manager (Must be the last line in tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
