# Sets user-defined palette
palette = "tokyo_night_night"

format = """
[](blue)\
$python\
$username\
$hostname\
[](bg:lavender fg:blue)\
$directory\
[](fg:lavender bg:pink)\
$git_branch\
$git_status\
[](fg:pink bg:green)\
$time\
[ ](fg:green)\
"""
command_timeout = 5000
# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:blue fg:surface0"
style_root = "bg:blue fg:surface0"
format = '[$user ]($style)'

[hostname]
ssh_only = true
style = "bg:blue fg:surface0"
format = '[$hostname ]($style)'

[directory]
style = "bg:lavender  fg:surface0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:sapphire"
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:pink fg:surface0"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:pink fg:surface0"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:blue fg:surface0"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = ""
style = "bg:blue"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"             # Hour:Minute Format
style = "bg:green fg:surface0"
format = '[ $time ]($style)'

